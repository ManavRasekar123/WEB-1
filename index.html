<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d08">
<title>Athletes Arena | Premium Turf Booking · Pune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f6ee;
  --panel: #ffffff;
  --panel-alt: #f8faf4;
  --text: #0a0d08;
  --muted: #5e6858;
  --light-muted: #8b9685;
  --line: #dbe2d4;
  --lime: #9bd51d;
  --lime-dark: #74a30f;
  --red: #f04e30;
  --red-dark: #d43b1e;
  --tint: #e6f4c8;
  --tint-soft: #f2f9e4;
  --glow: rgba(155, 213, 29, 0.25);
  --shadow: 0 10px 25px rgba(10, 13, 8, 0.05);
  --shadow-lg: 0 18px 45px rgba(10, 13, 8, 0.12);
  --radius: 8px;
  --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; scroll-padding-top: 80px; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
.w { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
.mono { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
.red { color: var(--red); }
.lime { color: var(--lime-dark); }
.muted { color: var(--muted); }
h1, h2, h3, h4 {
  font-family: "Barlow Condensed", -apple-system, Impact, sans-serif;
  font-weight: 800;
  text-transform: uppercase;
  line-height: 0.94;
}
h1 { font-size: clamp(52px, 11vw, 108px); }
h2 { font-size: clamp(38px, 7vw, 68px); }
h3 { font-size: clamp(24px, 5vw, 36px); }

/* Navigation */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(243, 246, 238, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  height: 68px;
}
nav .w {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}
.brand-badge {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--red) 0%, #c83216 100%);
  color: #fff;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
  box-shadow: 0 4px 12px rgba(240, 78, 48, 0.35);
  position: relative;
  overflow: hidden;
}
.brand-badge::after {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;
  width: 8px;
  height: 8px;
  background: var(--lime);
}
.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.brand-name {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.brand-name i {
  font-style: normal;
  color: var(--lime-dark);
  margin-left: 2px;
}
.brand-sub {
  font-family: "Space Mono", monospace;
  font-size: 9px;
  letter-spacing: 1.2px;
  color: var(--muted);
  margin-top: 3px;
  text-transform: uppercase;
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: "Space Mono", monospace;
  font-size: 11px;
  color: var(--muted);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
  animation: pulseDot 2s infinite ease-in-out;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

/* Buttons */
.btn {
  background: var(--red);
  color: #fff;
  border: 0;
  padding: 15px 24px;
  font-weight: 700;
  font-size: 15px;
  border-radius: var(--radius);
  cursor: pointer;
  display: inline-flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  box-shadow: 0 4px 14px rgba(240, 78, 48, 0.25);
}
.btn:hover {
  background: var(--red-dark);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(240, 78, 48, 0.35);
}
.btn:active {
  transform: translateY(0);
}
.btn.s {
  padding: 9px 16px;
  font-size: 13px;
  box-shadow: none;
}
.btn.f { width: 100%; }
.btn.o {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.btn.o:hover {
  background: var(--panel-alt);
  border-color: #bcc6b5;
}
.btn.lime-btn {
  background: var(--lime);
  color: #0a0d08;
  box-shadow: 0 4px 14px rgba(155, 213, 29, 0.3);
}
.btn.lime-btn:hover {
  background: #a9e821;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* Hero Section */
.hero {
  position: relative;
  overflow: hidden;
  padding: 60px 0 50px;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 85% 20%, rgba(155, 213, 29, 0.22) 0%, transparent 55%),
    linear-gradient(180deg, transparent 65%, var(--bg) 100%);
  pointer-events: none;
}
.hero-tagline {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(240, 78, 48, 0.1);
  padding: 6px 14px;
  border-radius: 999px;
  margin-bottom: 20px;
}
.hero p {
  max-width: 540px;
  line-height: 1.65;
  color: var(--muted);
  margin: 22px 0 28px;
  font-size: 17px;
}
.stats {
  display: flex;
  gap: 36px;
  margin-top: 48px;
  flex-wrap: wrap;
}
.stats b {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 44px;
  display: block;
  line-height: 1;
}

/* Sections */
section { padding: 60px 0; }
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.pic {
  position: relative;
  overflow: hidden;
  color: #fff;
  background: #08130c;
  min-height: 360px;
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 26px;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.pic:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}
.pic .bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.pic:hover .bg {
  transform: scale(1.03);
}
.pic::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%);
}
.pic > *:not(.bg) {
  position: relative;
  z-index: 2;
}
.pic h3 {
  font-size: 46px;
  margin: 6px 0 4px;
}
.pic .lime-tag {
  color: #c9f565;
  font-weight: 700;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Amenities Grid */
.am {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.am-card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 22px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.am-card b {
  display: block;
  font-size: 16px;
  margin-bottom: 6px;
}
.am-card span {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.5;
}

/* Location Card */
.loc-box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 30px;
  margin-top: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

/* Booking Layout */
.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 20px 0 16px;
  color: var(--lime-dark);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.back:hover { text-decoration: underline; }
.col { max-width: 660px; margin: 0 auto; }
.lab {
  margin: 28px 0 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* Interactive Option Buttons */
.opt {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 15px;
  border-radius: var(--radius);
  text-align: left;
  cursor: pointer;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  transition: all 0.15s ease;
  user-select: none;
}
.opt:hover:not(:disabled) {
  border-color: #bcc6b5;
  background: var(--panel-alt);
}
.opt.on {
  background: var(--tint);
  border-color: var(--lime-dark);
  box-shadow: 0 0 0 1px var(--lime-dark);
}
.opt b { display: block; font-size: 16px; margin-bottom: 2px; }
.opt small { color: var(--muted); font-size: 12px; }
.opt:disabled {
  opacity: 0.38;
  cursor: not-allowed;
  background: #eaece5;
  border-color: #d6d9d0;
  text-decoration: line-through;
}

/* Turf Selection Cards */
.turf-opt {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  margin-bottom: 10px;
  padding: 16px;
}
.turf-badge {
  width: 32px;
  height: 32px;
  background: var(--tint);
  color: var(--lime-dark);
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 15px;
}
.turf-price {
  margin-left: auto;
  text-align: right;
  font-weight: 700;
  color: var(--lime-dark);
  font-size: 16px;
}

/* Date Selection Pills */
.date-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: thin;
}
.date-pill {
  min-width: 90px;
  padding: 10px 8px;
  text-align: center;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.date-pill.on {
  background: var(--tint);
  border-color: var(--lime-dark);
  box-shadow: 0 0 0 1px var(--lime-dark);
}
.date-pill .dp-day {
  font-size: 11px;
  font-family: "Space Mono", monospace;
  color: var(--muted);
  text-transform: uppercase;
  display: block;
}
.date-pill .dp-num {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 20px;
  font-weight: 800;
  display: block;
  margin-top: 2px;
}

/* Slot Time Period Filters */
.slot-filters {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.sf-pill {
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11.5px;
  font-family: "Space Mono", monospace;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
.sf-pill.on {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}

/* Slot Card */
.sl-btn {
  text-align: center;
  padding: 12px 6px;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.sl-time { font-weight: 700; font-size: 13.5px; }
.sl-status {
  font-size: 10px;
  font-family: "Space Mono", monospace;
  color: var(--light-muted);
}
.sl-btn.on .sl-status { color: var(--lime-dark); font-weight: 700; }
.sl-btn:disabled .sl-status { color: #949990; }

/* Reservation Breakdown Box */
.res-card {
  background: var(--panel);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  border-top: 4px solid var(--red);
  padding: 24px;
  margin: 32px 0 20px;
  box-shadow: var(--shadow);
}
.res-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.res-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px;
}
.res-row:last-of-type { border-bottom: none; }
.res-tot {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 38px;
  font-weight: 800;
  color: var(--text);
}
.adv-box {
  background: var(--tint);
  border: 1px dashed var(--lime-dark);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 16px 0;
}
.adv-box b {
  font-size: 28px;
  color: var(--lime-dark);
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 800;
}
.venue-bal {
  background: var(--panel-alt);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13.5px;
  color: var(--muted);
  margin-bottom: 20px;
}

/* Form Inputs */
.form-group {
  margin-bottom: 14px;
}
.form-label {
  display: block;
  font-family: "Space Mono", monospace;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}
input, select {
  width: 100%;
  height: 50px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--text);
  padding: 0 16px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease;
}
input:focus, select:focus {
  border-color: var(--lime-dark);
  box-shadow: 0 0 0 2px var(--glow);
}
.input-error {
  color: var(--red);
  font-size: 12px;
  margin-top: 4px;
  display: none;
}

/* Modal Dialog */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(10, 13, 8, 0.65);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-card {
  background: var(--panel);
  border-radius: var(--radius-lg);
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--line);
  overflow: hidden;
  animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  background: #0d120a;
  color: #fff;
  padding: 20px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-body { padding: 24px; }
.pay-banner {
  background: #fff8f0;
  border: 1px solid #fed7aa;
  color: #9a3412;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 12px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.pay-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}
.pay-tab {
  padding: 10px 6px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--line);
  background: var(--panel-alt);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s ease;
}
.pay-tab.on {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}
.pay-content {
  background: var(--panel-alt);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 20px;
}

/* Confirmation Receipt */
.confirm-box {
  background: var(--panel);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  padding: 36px 28px;
  box-shadow: var(--shadow);
  text-align: center;
  margin: 30px 0;
}
.chk-circle {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--tint);
  color: var(--lime-dark);
  display: grid;
  place-items: center;
  margin: 0 auto 16px;
  font-size: 38px;
  font-weight: 900;
}
.bid-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--tint);
  border: 1px dashed var(--lime-dark);
  padding: 8px 18px;
  border-radius: 999px;
  font-family: "Space Mono", monospace;
  font-weight: 700;
  font-size: 15px;
  color: var(--lime-dark);
  margin: 12px 0 20px;
}
.rec-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  margin: 20px 0;
}
.rec-table td {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.rec-table td:last-child {
  text-align: right;
  font-weight: 600;
}

/* Owner Dashboard */
.owner-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
}
.owner-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--line);
  margin: 24px 0 20px;
}
.otab {
  padding: 12px 18px;
  font-family: "Space Mono", monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s ease;
}
.otab.on {
  color: var(--text);
  border-color: var(--red);
}
.stat5 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin: 20px 0;
}
.stat5-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.stat5-card b {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 32px;
  display: block;
  line-height: 1.1;
}
.tw {
  overflow-x: auto;
  background: var(--panel);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td {
  text-align: left;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th {
  background: var(--panel-alt);
  font-family: "Space Mono", monospace;
  font-size: 11px;
  color: var(--muted);
}
tr:last-child td { border-bottom: none; }

/* Footer */
footer {
  margin-top: auto;
  border-top: 1px solid var(--line);
  background: var(--panel);
  padding: 28px 0;
  font-size: 13.5px;
  color: var(--muted);
}
footer .w {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .cards, .am { grid-template-columns: 1fr; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .g4 { grid-template-columns: repeat(2, 1fr); }
  .loc-box { flex-direction: column; align-items: flex-start; }
  .stats { gap: 20px; }
  .nav-actions .status-pill { display: none; }
}

/* Print Stylesheet for Official Receipt */
@media print {
  nav, footer, .back, button, .modal-overlay { display: none !important; }

} catch (e) {

}

// Formatting Utilities
function h12(h) {
  h = h % 24;
  var ampm = h < 12 ? "AM" : "PM";
  var formattedH = (h + 11) % 12 + 1;
  return String(formattedH).padStart(2, "0") + ":00 " + ampm;
}

function timeRange(startH, dur) {
  var endH = (startH + dur) % 24;
  return h12(startH) + " – " + h12(endH) + " (" + dur + (dur > 1 ? " hrs" : " hr") + ")";
}

function inr(n) {
  return "₹" + Number(n).toLocaleString("en-IN");
}

function fd(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("en-IN", {
    weekday: "short",
    day: "numeric",
    month: "short",
    year: "numeric"
  });
}

function getNextDays(n) {
  var days = [];
  var d = new Date();
  for (var i = 0; i < n; i++) {
    var cur = new Date(d);
    cur.setDate(d.getDate() + i);
    days.push({
      dateStr: cur.toISOString().slice(0, 10),
      dayName: i === 0 ? "Today" : (i === 1 ? "Tmrw" : cur.toLocaleDateString("en-IN", { weekday: "short" })),
      dateNum: cur.getDate(),
      month: cur.toLocaleDateString("en-IN", { month: "short" })
    });
  }
  return days;
}

// Pseudo busy simulation (so demo has realistic occupied slots)
function dBusy(d, c, h) {
  var x = 0, s = d + c + h;
  for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 97;
  return x % 5 === 0;
}

// Check single hour busy
function slotIsBusy(d, c, h) {
  if (dBusy(d, c, h)) return true;
  var isBooked = S.bookings.some(function(b) {
    return b.date === d && b.turf === c && h >= b.hour && h < (b.hour + b.dur);
  });
  if (isBooked) return true;
  var isBlocked = S.blocked.some(function(k) {
    return k.date === d && k.turf === c && h >= k.hour && h < (k.hour + (k.dur || 1));
  });
  return isBlocked;
}

// Check if entire multi-hour block starting at h is free
function isSlotFree(h) {
  if (h + B.dur > 24) return false;
  var now = new Date();
  var currentHour = now.getHours();
  for (var i = 0; i < B.dur; i++) {
    var checkH = h + i;
    if (B.date === todayStr && checkH <= currentHour) return false;
    if (slotIsBusy(B.date, B.turf, checkH)) return false;
  }
  return true;
}

// Pricing Calculations
function calcTotal() {
  var rate = S.prices[B.turf] || 999;
  return rate * B.dur;
}

function calcAdvance() {
  var pct = (S.advPercent || 30) / 100;
  return Math.round(calcTotal() * pct);
}

function calcVenueBalance() {
  return calcTotal() - calcAdvance();
}

      '<div class="res-row"><span class="muted">Rate</span><b>' + inr(S.prices[B.turf]) + ' / hr</b></div>',
      '<div class="res-row"><span class="muted">Total Turf Fare</span><span class="res-tot">' + inr(totalAmt) + '</span></div>',

      '<div class="adv-box">',
        '<div>',

      '<p class="muted" style="text-align:center;font-size:12px;margin-top:12px">🔒 Instant Slot Lock · No Hidden Convenience Fees</p>',

var activePayTab = "upi";

function openPaymentModal() {
  var name = $("nm").value.trim();
  var phone = $("ph").value.trim();
  var hasErr = false;

  if (!name) {
    $("nm-err").style.display = "block";
    hasErr = true;
  } else {
    $("nm-err").style.display = "none";
  }

  if (!/^[6-9]\d{9}$/.test(phone)) {
    $("ph-err").style.display = "block";
    hasErr = true;
  } else {
    $("ph-err").style.display = "none";
  }

  if (hasErr) return;

  // Double check slot availability
  if (!isSlotFree(B.hour)) {
    alert("Sorry! This slot was just taken or blocked. Please choose another time.");
    location.hash = "#/book";
    return;
  }

  renderPayModal();
}

  var notes = $("notes") ? $("notes").value : "";

  var advAmt = calcAdvance();
  var balAmt = calcVenueBalance();
  var bookingId = "AA-" + Math.floor(100000 + Math.random() * 900000);

  var bookingRecord = {
    id: bookingId,
    name: name,
    phone: phone,
    email: email,
    notes: notes,
    sport: B.sport,
    date: B.date,
    hour: B.hour,

    turf: B.turf,
    total: totalAmt,
    adv: advAmt,
    bal: balAmt,

  closePayModal();

        '</div>',

        '<div class="g2" style="margin-bottom:12px">',
          '<button class="btn o" onclick="window.print()">🖨️ Print / Save Receipt</button>',
          '<a class="btn o" href="https://api.whatsapp.com/send?text=' + shareText + '" target="_blank" rel="noopener">💬 Share on WhatsApp</a>',
        '</div>',
        '<div class="g2">',
          '<a class="btn lime-btn" href="#/book">Book another slot</a>',
          '<a class="btn o" href="#/">Return to Home</a>',
        '</div>',
      '</div>',
    '</div>'
  ].join("");

  window.scrollTo(0, 0);
}

/* ==========================================================================
   VIEW 6: OWNER ADMIN DASHBOARD
   ========================================================================== */
var activeOwnerTab = "bookings";
var ownerFilter = "all";

function setOwnerTab(tab) {
  activeOwnerTab = tab;
  owner();
}

function setOwnerFilter(filter) {
  ownerFilter = filter;
  owner();
}

function owner() {
  if (!admin) {
    app.innerHTML = [
      '<div class="w col">',
        '<a class="back" href="#/">← Back to Home</a>',
        '<div class="mono red">Owner Portal · Staff Access</div>',
        '<h1 style="font-size:64px;margin:12px 0">Turf<br><span class="lime">manager.</span></h1>',
        '<p class="muted">Access active reservations, block offline slots, and adjust turf hourly pricing.</p>',
        '<div class="res-card" style="margin-top:24px">',
          '<div class="form-group">',
            '<label class="form-label" for="pin">Enter Owner Security PIN</label>',
            '<input id="pin" type="password" maxlength="8" placeholder="Enter PIN (Demo: 1234)">',
          '</div>',
          '<button class="btn f" onclick="handleOwnerLogin()">Access Dashboard →</button>',
          '<small class="muted" style="display:block;text-align:center;margin-top:12px">Demo Security PIN: <b>1234</b></small>',
        '</div>',
      '</div>'
    ].join("");
    window.scrollTo(0, 0);
    return;
  }

  var todayBookings = S.bookings.filter(function(b) { return b.date === todayStr; });
  var totalAdvance = S.bookings.reduce(function(acc, b) { return acc + (b.adv || 0); }, 0);
  var totalPendingBal = S.bookings.reduce(function(acc, b) { return acc + (b.bal || 0); }, 0);

  var hs = "";
  for (var h = 0; h < 24; h++) {
    hs += '<option value="' + h + '">' + h12(h) + '</option>';
  }

  app.innerHTML = [
    '<div class="w">',
      '<div class="owner-head">',
        '<div>',
          '<a class="back" href="#/" style="margin:0 0 8px">← Back to Arena</a>',
          '<h1 style="font-size:clamp(44px, 7vw, 64px)">Owner <span class="lime">Dashboard</span></h1>',
          '<span class="mono muted">Athletes Arena · Khadi Machine, Pune</span>',
        '</div>',
        '<div>',
          '<button class="btn s o" onclick="admin=false;owner()">Log out</button>',
        '</div>',
      '</div>',

      '<div class="stat5">',
        '<div class="stat5-card"><span class="mono muted">Today Bookings</span><b>' + todayBookings.length + '</b></div>',
        '<div class="stat5-card"><span class="mono muted">Total Bookings</span><b>' + S.bookings.length + '</b></div>',
        '<div class="stat5-card"><span class="mono muted">Advance Collected</span><b style="color:var(--lime-dark)">' + inr(totalAdvance) + '</b></div>',
        '<div class="stat5-card"><span class="mono muted">Pending at Venue</span><b style="color:var(--red)">' + inr(totalPendingBal) + '</b></div>',
        '<div class="stat5-card"><span class="mono muted">Blocked Slots</span><b>' + S.blocked.length + '</b></div>',
      '</div>',

      '<div class="owner-tabs">',
        '<div class="otab' + (activeOwnerTab === "bookings" ? " on" : "") + '" onclick="setOwnerTab(\'bookings\')">Reservations (' + S.bookings.length + ')</div>',
        '<div class="otab' + (activeOwnerTab === "blocker" ? " on" : "") + '" onclick="setOwnerTab(\'blocker\')">Block Slots (' + S.blocked.length + ')</div>',
        '<div class="otab' + (activeOwnerTab === "rates" ? " on" : "") + '" onclick="setOwnerTab(\'rates\')">Pricing & Settings</div>',
      '</div>',

      renderOwnerTabContent(hs),
    '</div>'
  ].join("");

  window.scrollTo(0, 0);
}

function handleOwnerLogin() {
  var pin = $("pin").value.trim();
  if (OwnerAuth.verifyPin(pin)) {
    admin = true;
    owner();
  } else {
    alert("Incorrect PIN. For this demo, please enter 1234.");
  }
}

function renderOwnerTabContent(hs) {
  if (activeOwnerTab === "bookings") {
    var filtered = S.bookings.slice().reverse();
    if (ownerFilter === "today") {
      filtered = filtered.filter(function(b) { return b.date === todayStr; });
    } else if (ownerFilter === "Turf 1") {
      filtered = filtered.filter(function(b) { return b.turf === "Turf 1"; });
    } else if (ownerFilter === "Turf 2") {
      filtered = filtered.filter(function(b) { return b.turf === "Turf 2"; });
    }

    return [
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">',
        '<div class="slot-filters" style="margin:0">',
          '<button class="sf-pill' + (ownerFilter === "all" ? " on" : "") + '" onclick="setOwnerFilter(\'all\')">All (' + S.bookings.length + ')</button>',
          '<button class="sf-pill' + (ownerFilter === "today" ? " on" : "") + '" onclick="setOwnerFilter(\'today\')">Today</button>',
          '<button class="sf-pill' + (ownerFilter === "Turf 1" ? " on" : "") + '" onclick="setOwnerFilter(\'Turf 1\')">Turf 1</button>',
          '<button class="sf-pill' + (ownerFilter === "Turf 2" ? " on" : "") + '" onclick="setOwnerFilter(\'Turf 2\')">Turf 2</button>',
        '</div>',
      '</div>',

      '<div class="tw">',
        '<table>',
          '<thead>',
            '<tr>',
              '<th>Booking ID</th>',
              '<th>Player Name</th>',
              '<th>Mobile</th>',
              '<th>Sport & Turf</th>',
              '<th>Date</th>',
              '<th>Time Slot</th>',
              '<th>Advance Paid</th>',
              '<th>Balance Due</th>',
              '<th>Status</th>',
              '<th>Actions</th>',
            '</tr>',
          '</thead>',
          '<tbody>',
            (filtered.map(function(b, idx) {
              var realIdx = S.bookings.indexOf(b);
              return '<tr>' +
                '<td><b>' + b.id + '</b></td>' +
                '<td>' + b.name + '</td>' +
                '<td><a href="tel:' + b.phone + '" style="text-decoration:underline">📞 ' + b.phone + '</a></td>' +
                '<td>' + b.sport + ' (' + b.turf + ')</td>' +
                '<td>' + fd(b.date) + '</td>' +
                '<td>' + timeRange(b.hour, b.dur) + '</td>' +
                '<td style="color:var(--lime-dark);font-weight:700">' + inr(b.adv) + '</td>' +
                '<td style="color:var(--red);font-weight:700">' + inr(b.bal) + '</td>' +
                '<td><span class="status-pill" style="padding:2px 8px;font-size:10px;background:var(--tint)">✓ Confirmed</span></td>' +
                '<td><button class="btn s o" onclick="cancelBooking(' + realIdx + ')" style="padding:5px 10px;font-size:11px;color:var(--red)">Cancel</button></td>' +
              '</tr>';
            }).join("") || '<tr><td colspan="10" style="text-align:center;padding:30px;color:var(--muted)">No bookings found for this filter.</td></tr>'),
          '</tbody>',
        '</table>',
      '</div>'
    ].join("");
  } else if (activeOwnerTab === "blocker") {
    return [
      '<div class="res-card" style="margin-top:0">',
        '<div class="mono red" style="margin-bottom:12px">Block Turf Slot (Offline Booking / Maintenance)</div>',
        '<div class="g3" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr))">',
          '<div class="form-group"><label class="form-label">Date</label><input type="date" id="blk-date" value="' + todayStr + '"></div>',
          '<div class="form-group"><label class="form-label">Turf</label><select id="blk-turf"><option>Turf 1</option><option>Turf 2</option></select></div>',
          '<div class="form-group"><label class="form-label">Start Time</label><select id="blk-hour">' + hs + '</select></div>',
          '<div class="form-group"><label class="form-label">Duration</label><select id="blk-dur"><option value="1">1 Hour</option><option value="2">2 Hours</option><option value="3">3 Hours</option></select></div>',
          '<div class="form-group"><label class="form-label">Reason</label><input id="blk-reason" placeholder="e.g. Phone booking / Maintenance"></div>',
        '</div>',
        '<button class="btn s" onclick="addSlotBlock()">Block Slot Now</button>',
      '</div>',

      '<div class="mono lab">Currently Blocked Slots (' + S.blocked.length + ')</div>',
      '<div class="tw">',
        '<table>',
          '<thead>',
            '<tr><th>Date</th><th>Turf</th><th>Time</th><th>Reason</th><th>Action</th></tr>',
          '</thead>',
          '<tbody>',
            (S.blocked.map(function(k, idx) {
              return '<tr>' +
                '<td>' + fd(k.date) + '</td>' +
                '<td>' + k.turf + '</td>' +
                '<td>' + timeRange(k.hour, k.dur || 1) + '</td>' +
                '<td>' + (k.reason || 'Manual block') + '</td>' +
                '<td><button class="btn s o" onclick="removeSlotBlock(' + idx + ')" style="padding:4px 8px;font-size:11px">Unblock</button></td>' +
              '</tr>';
            }).join("") || '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">No manually blocked slots.</td></tr>'),
          '</tbody>',
        '</table>',
      '</div>'
    ].join("");
  } else {
    return [
      '<div class="res-card" style="margin-top:0;max-width:540px">',
        '<div class="mono red" style="margin-bottom:14px">Turf Hourly Rate Settings</div>',
        '<div class="form-group">',
          '<label class="form-label">Turf 1 Rate (₹ / hour)</label>',
          '<input type="number" id="p1" value="' + S.prices["Turf 1"] + '">',
        '</div>',
        '<div class="form-group">',
          '<label class="form-label">Turf 2 Rate (₹ / hour)</label>',
          '<input type="number" id="p2" value="' + S.prices["Turf 2"] + '">',
        '</div>',
        '<div class="form-group">',
          '<label class="form-label">Required Advance Deposit (%)</label>',
          '<input type="number" id="p-adv" value="' + (S.advPercent || 30) + '" min="10" max="100">',
        '</div>',
        '<button class="btn s" onclick="saveOwnerPrices()">Save Pricing Settings</button>',
      '</div>'
    ].join("");
  }
}

function addSlotBlock() {
  var d = $("blk-date").value;
  var t = $("blk-turf").value;
  var h = +$("blk-hour").value;
  var dur = +$("blk-dur").value;
  var reason = $("blk-reason").value.trim() || "Manual offline block";

  S.blocked.push({ date: d, turf: t, hour: h, dur: dur, reason: reason });
  save();
  owner();
}

function removeSlotBlock(idx) {
  S.blocked.splice(idx, 1);
  save();
  owner();
}

function cancelBooking(idx) {
  if (confirm("Are you sure you want to cancel this booking? Refund would be returned to the player.")) {
    S.bookings.splice(idx, 1);
    save();
    owner();
  }
}

function saveOwnerPrices() {
  var p1 = parseInt($("p1").value, 10);
  var p2 = parseInt($("p2").value, 10);
  var advP = parseInt($("p-adv").value, 10);

  if (p1 > 0 && p2 > 0 && advP > 0) {
    S.prices["Turf 1"] = p1;
    S.prices["Turf 2"] = p2;
    S.advPercent = advP;
    save();
    alert("Pricing and advance settings updated successfully.");
    owner();
  } else {
    alert("Please enter valid positive numbers for all pricing fields.");
  }
}

/* ==========================================================================
   ROUTER
   ========================================================================== */
function route() {
  var hash = location.hash || "#/";
  var path = hash.replace("#/", "").split("?")[0];

  var routes = {
    "": home,
    "book": book,
    "checkout": checkout,
    "owner": owner
  };

  var handler = routes[path] || home;
  handler();
}

window.addEventListener("hashchange", route);
route();

</script>
</body>
</html>
